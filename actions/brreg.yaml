openapi: 3.1.0
info:
  title: Brønnøysundregistrene
  version: "1.1"
  description: Brønnøysundregistrenes åpne API-er for Enhetsregisteret og Regnskapsregisteret, uten nøkkel. Søk etter enheter på navn, slå opp én enhet, hent årsregnskap og roller. Data under Norsk lisens for offentlige data (NLOD 2.0); oppgi Brønnøysundregistrene som kilde.
servers:
  - url: https://data.brreg.no
paths:
  /enhetsregisteret/api/enheter:
    get:
      operationId: sokFirma
      summary: Søk etter firma og andre enheter på navn
      description: Bruk når brukeren nevner et firma uten organisasjonsnummer. Skriv navnet med små bokstaver; det gir flere treff. De mest relevante står først i _embedded.enheter. Les organisasjonsnummer, navn, organisasjonsform.beskrivelse, forretningsadresse.kommune og antallAnsatte. Kan flere treff passe, spør brukeren. Mangler _embedded, finnes ingen treff.
      parameters:
        - name: navn
          in: query
          required: true
          schema: { type: string }
          description: Hele eller deler av navnet, med små bokstaver, for eksempel «equinor»
        - name: size
          in: query
          required: false
          schema: { type: integer, default: 5 }
          description: Antall treff. 5 holder nesten alltid.
      responses:
        "200":
          description: Treffliste. page.totalElements er antall treff i alt.
          content:
            application/json:
              schema: { type: object }
  /enhetsregisteret/api/enheter/{orgnr}:
    get:
      operationId: slaaOppFirma
      summary: Slå opp én enhet på organisasjonsnummer
      description: Gir navn, organisasjonsform, forretningsadresse, naeringskode1 til 3, antallAnsatte, stiftelsesdato, registrertIMvaregisteret, konkurs, underAvvikling, slettedato og historiskeNavn. Si alltid status. 404 betyr at nummeret ikke finnes (kan være en underenhet); 410 betyr at enheten er fjernet av juridiske årsaker.
      parameters:
        - name: orgnr
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9]{9}$" }
          description: Ni sifre uten mellomrom, for eksempel 923609016
      responses:
        "200":
          description: Enheten
          content:
            application/json:
              schema: { type: object }
        "404":
          description: Ikke funnet
        "410":
          description: Fjernet av juridiske årsaker
  /enhetsregisteret/api/enheter/{orgnr}/roller:
    get:
      operationId: hentRoller
      summary: Hent daglig leder, styre, revisor og regnskapsfører for én enhet
      description: Svaret har rollegrupper med roller. Les type.beskrivelse og person.navn (fornavn, mellomnavn, etternavn), eller enhet.navn og enhet.organisasjonsnummer for revisor og regnskapsfører. Hopp over roller med avregistrert eller fratraadt satt til true. Vis aldri fødselsdatoer. Aksjonærer finnes ikke her.
      parameters:
        - name: orgnr
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9]{9}$" }
          description: Ni sifre uten mellomrom, for eksempel 923609016
      responses:
        "200":
          description: Rollene
          content:
            application/json:
              schema: { type: object }
        "404":
          description: Ikke funnet
  /regnskapsregisteret/regnskap/{orgnr}:
    get:
      operationId: hentRegnskap
      summary: Hent årsregnskapet for én enhet, de siste årene
      description: Gir en liste med regnskap, vanligvis tre år, både SELSKAP og KONSERN når det finnes. Si alltid år, type og valuta (Equinor rapporterer i USD). Beløp er i hele enheter, ikke i tusen. Les resultatregnskapResultat (driftsresultat.driftsinntekter.sumDriftsinntekter, driftsresultat.driftsresultat, aarsresultat), eiendeler.sumEiendeler og egenkapitalGjeld (egenkapital.sumEgenkapital, gjeldOversikt.sumGjeld). 404 betyr at det ikke er levert regnskap; 500 med «oppstillingsplan som ikke er stottet» betyr bank eller forsikring, som ikke gis ut i åpne data.
      parameters:
        - name: orgnr
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9]{9}$" }
          description: Ni sifre uten mellomrom, for eksempel 923609016
        - name: år
          in: query
          required: false
          schema: { type: integer }
          description: Regnskapsår, for eksempel 2025. Utelat for de siste årene.
      responses:
        "200":
          description: Liste med regnskap
          content:
            application/json:
              schema: { type: array, items: { type: object } }
        "404":
          description: Ingen regnskap levert
        "500":
          description: Oppstillingsplan som ikke gis ut i åpne data (bank, forsikring)
